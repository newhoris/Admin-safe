<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung - Panneau d'Administration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6fc;
            color: #000;
            padding-bottom: 40px;
        }

        /* En-tête Admin */
        .admin-header {
            background-color: #1428A0;
            color: #fff;
            padding: 20px 15px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 12px rgba(20, 40, 160, 0.2);
        }

        .admin-title {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .container {
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Onglets de navigation Admin */
        .admin-tabs {
            display: flex;
            background: #fff;
            border-radius: 12px;
            padding: 5px;
            margin: 15px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            border: 1px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            color: #555;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #1428A0;
            color: #fff;
        }

        /* Sections des onglets */
        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
        }

        .section-heading {
            font-size: 14px;
            font-weight: 800;
            color: #1428A0;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Cartes de requêtes */
        .req-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .req-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .req-info strong {
            color: #1428A0;
        }

        .req-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-validate {
            background: #d4edda;
            color: #155724;
        }

        .btn-reject {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-box {
            background: #fff;
            border: 1px dashed #ccc;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        .empty-box i {
            color: #1428A0;
            font-size: 24px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="admin-header">
        <div class="admin-title"><i class="fas fa-shield-halved"></i> Samsung - Gestion Administrative</div>
    </div>

    <div class="container">
        <!-- Onglets -->
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('recharges', this)">Recharges</button>
            <button class="tab-btn" onclick="switchTab('withdrawals', this)">Retraits</button>
            <button class="tab-btn" onclick="switchTab('users', this)">Utilisateurs</button>
        </div>

        <!-- Section 1 : Recharges en attente -->
        <div id="section-recharges" class="admin-section active">
            <div class="section-heading"><i class="fas fa-wallet"></i> Demandes de recharges en attente</div>
            <div id="rechargesContainer">
                <div class="empty-box"><i class="fas fa-spinner fa-spin"></i><br>Chargement...</div>
            </div>
        </div>

        <!-- Section 2 : Retraits en attente -->
        <div id="section-withdrawals" class="admin-section">
            <div class="section-heading"><i class="fas fa-money-bill-transfer"></i> Demandes de retraits en attente</div>
            <div id="withdrawalsContainer">
                <div class="empty-box"><i class="fas fa-spinner fa-spin"></i><br>Chargement...</div>
            </div>
        </div>

        <!-- Section 3 : Liste des Utilisateurs -->
        <div id="section-users" class="admin-section">
            <div class="section-heading"><i class="fas fa-users"></i> Base des utilisateurs</div>
            <div id="usersContainer">
                <div class="empty-box"><i class="fas fa-spinner fa-spin"></i><br>Chargement...</div>
            </div>
        </div>
    </div>

    <script>
        const dbUrl = "https://canal-e4274-default-rtdb.firebaseio.com";

        // Sécurité anti-XSS
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        // Gestion des onglets
        function switchTab(tabName, element) {
            document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(`section-${tabName}`).classList.add('active');
            element.classList.add('active');

            if (tabName === 'recharges') loadAdminRecharges();
            if (tabName === 'withdrawals') loadAdminWithdrawals();
            if (tabName === 'users') loadAdminUsers();
        }

        // --- CHARGEMENT DES RECHARGES ---
        async function loadAdminRecharges() {
            const container = document.getElementById('rechargesContainer');
            try {
                const res = await fetch(`${dbUrl}/recharges.json`);
                const allRecharges = await res.json();

                if (!allRecharges) {
                    container.innerHTML = `<div class="empty-box"><i class="fas fa-check-circle"></i><br>Aucune demande de recharge.</div>`;
                    return;
                }

                let html = "";
                for (const phone in allRecharges) {
                    const userRecharges = allRecharges[phone];
                    for (const reqId in userRecharges) {
                        const item = userRecharges[reqId];
                        if (item.status === "En attente") {
                            const date = item.createdAt ? new Date(item.createdAt).toLocaleString('fr-FR') : '';
                            html += `
                                <div class="req-card">
                                    <div class="req-info">
                                        <div><strong>Téléphone :</strong> ${escapeHtml(phone)}</div>
                                        <div><strong>Montant :</strong> <span style="color:#1428A0; font-weight:800;">${Number(item.amount).toLocaleString('fr-FR')} FC</span></div>
                                        <div><strong>Méthode :</strong> ${escapeHtml(item.method)} (Dest: ${escapeHtml(item.recipientPhone)})</div>
                                        <div><strong>Date :</strong> ${escapeHtml(date)}</div>
                                    </div>
                                    <div class="req-actions">
                                        <button class="btn-action btn-validate" onclick="processRecharge('${phone}', '${reqId}', ${item.amount}, 'Validé')">
                                            <i class="fas fa-check"></i> Valider
                                        </button>
                                        <button class="btn-action btn-reject" onclick="processRecharge('${phone}', '${reqId}', ${item.amount}, 'Rejeté')">
                                            <i class="fas fa-times"></i> Rejeter
                                        </button>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
                container.innerHTML = html || `<div class="empty-box"><i class="fas fa-check-circle"></i><br>Aucune recharge en attente.</div>`;
            } catch (err) {
                container.innerHTML = `<div class="empty-box" style="color:red;">Erreur de chargement</div>`;
            }
        }

        // Traiter une recharge (Valider / Rejeter)
        async function processRecharge(phone, reqId, amount, status) {
            if (!confirm(`Confirmer le statut "${status}" pour cette recharge ?`)) return;

            try {
                // 1. Mettre à jour le statut de la demande
                await fetch(`${dbUrl}/recharges/${encodeURIComponent(phone)}/${reqId}/status.json`, {
                    method: 'PUT',
                    body: JSON.stringify(status)
                });

                // 2. Si validé, ajouter le montant au solde de l'utilisateur
                if (status === "Validé") {
                    const userRes = await fetch(`${dbUrl}/users/${encodeURIComponent(phone)}/balance.json`);
                    const currentBalance = await userRes.json() || 0;
                    const newBalance = currentBalance + Number(amount);

                    await fetch(`${dbUrl}/users/${encodeURIComponent(phone)}/balance.json`, {
                        method: 'PUT',
                        body: JSON.stringify(newBalance)
                    });
                }

                alert("Opération effectuée avec succès !");
                loadAdminRecharges();
            } catch (err) {
                alert("Erreur lors de la mise à jour.");
            }
        }

        // --- CHARGEMENT DES RETRAITS ---
        async function loadAdminWithdrawals() {
            const container = document.getElementById('withdrawalsContainer');
            try {
                const res = await fetch(`${dbUrl}/withdrawals.json`);
                const allWithdrawals = await res.json();

                if (!allWithdrawals) {
                    container.innerHTML = `<div class="empty-box"><i class="fas fa-check-circle"></i><br>Aucune demande de retrait.</div>`;
                    return;
                }

                let html = "";
                for (const phone in allWithdrawals) {
                    const userWds = allWithdrawals[phone];
                    for (const reqId in userWds) {
                        const item = userWds[reqId];
                        if (item.status === "En attente") {
                            const date = item.createdAt ? new Date(item.createdAt).toLocaleString('fr-FR') : '';
                            html += `
                                <div class="req-card">
                                    <div class="req-info">
                                        <div><strong>Téléphone :</strong> ${escapeHtml(phone)}</div>
                                        <div><strong>Montant demandé :</strong> <span style="color:#1428A0; font-weight:800;">${Number(item.amount).toLocaleString('fr-FR')} FC</span></div>
                                        <div><strong>Net à recevoir (après 6%) :</strong> ${Number(item.netAmount).toLocaleString('fr-FR')} FC</div>
                                        <div><strong>Date :</strong> ${escapeHtml(date)}</div>
                                    </div>
                                    <div class="req-actions">
                                        <button class="btn-action btn-validate" onclick="processWithdrawal('${phone}', '${reqId}', ${item.amount}, 'Validé')">
                                            <i class="fas fa-check"></i> Valider (Payé)
                                        </button>
                                        <button class="btn-action btn-reject" onclick="processWithdrawal('${phone}', '${reqId}', ${item.amount}, 'Rejeté')">
                                            <i class="fas fa-times"></i> Rejeter (Rembourser)
                                        </button>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
                container.innerHTML = html || `<div class="empty-box"><i class="fas fa-check-circle"></i><br>Aucun retrait en attente.</div>`;
            } catch (err) {
                container.innerHTML = `<div class="empty-box" style="color:red;">Erreur de chargement</div>`;
            }
        }

        // Traiter un retrait
        async function processWithdrawal(phone, reqId, amount, status) {
            if (!confirm(`Confirmer l'action "${status}" ?`)) return;

            try {
                await fetch(`${dbUrl}/withdrawals/${encodeURIComponent(phone)}/${reqId}/status.json`, {
                    method: 'PUT',
                    body: JSON.stringify(status)
                });

                // Si rejeté, on recrédite le solde de l'utilisateur
                if (status === "Rejeté") {
                    const userRes = await fetch(`${dbUrl}/users/${encodeURIComponent(phone)}/balance.json`);
                    const currentBalance = await userRes.json() || 0;
                    const newBalance = currentBalance + Number(amount);

                    await fetch(`${dbUrl}/users/${encodeURIComponent(phone)}/balance.json`, {
                        method: 'PUT',
                        body: JSON.stringify(newBalance)
                    });
                }

                alert("Traitement effectué !");
                loadAdminWithdrawals();
            } catch (err) {
                alert("Erreur lors de l'opération.");
            }
        }

        // --- CHARGEMENT DES UTILISATEURS ---
        async function loadAdminUsers() {
            const container = document.getElementById('usersContainer');
            try {
                const res = await fetch(`${dbUrl}/users.json`);
                const users = await res.json();

                if (!users) {
                    container.innerHTML = `<div class="empty-box">Aucun utilisateur enregistré.</div>`;
                    return;
                }

                let html = "";
                for (const phone in users) {
                    const u = users[phone];
                    const balance = Number(u.balance || 0).toLocaleString('fr-FR');
                    const cardInfo = u.paymentCard && u.paymentCard.isBound 
                        ? `${escapeHtml(u.paymentCard.holderName)} (${escapeHtml(u.paymentCard.cardNumber)})` 
                        : 'Non liée';

                    html += `
                        <div class="req-card">
                            <div class="req-info">
                                <div><strong>Téléphone :</strong> ${escapeHtml(phone)}</div>
                                <div><strong>Solde :</strong> <span style="color:#1428A0; font-weight:800;">${balance} FC</span></div>
                                <div><strong>Carte/Compte :</strong> ${cardInfo}</div>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="empty-box" style="color:red;">Erreur de chargement des utilisateurs</div>`;
            }
        }

        // Charger par défaut l'onglet recharges au démarrage
        window.addEventListener('DOMContentLoaded', loadAdminRecharges);
    </script>
</body>
</html>
